name: Prepare
description: Prepare the environment for the workflow

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    - uses: actions/setup-node@v6
      with:
        node-version-file: .node-version

    - name: Turbo Cache
      uses: actions/cache@v5
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.job }}-

    # Installs on the pinned bun, before the canary bump: canary rejects a
    # lockfile it has just written itself when a dependency carries a large set
    # of optional peers (oven-sh/bun#20913).
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # TODO: remove this step once bun v1.4 is out and update .bun-version
    - name: Bump bun to canary
      shell: bash
      run: bun upgrade --canary
